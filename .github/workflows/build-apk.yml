name: Build Wassaly APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Extract project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q wassaly_app.zip -d project
          echo "=== Android folders found ==="
          find project -type d -path '*/android' -print

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          SETTINGS_FILE="$(find project -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found"
            find project -maxdepth 6 -type f | head -200
            exit 1
          fi

          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Building from: $ANDROID_DIR"

          cd "$ANDROID_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wassaly-Mohamed-Aboud-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error￼Enter
